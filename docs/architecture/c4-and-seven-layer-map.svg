<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#fafbfc"/>
  <text x="24" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#1a1a2e">Agent Control Lab — two-plane architecture</text>
  <text x="24" y="58" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#555">Execution plane (LangGraph) · Governance control plane (policy, identity, runtime, SRE, compliance, marketplace, audit)</text>

  <rect x="40" y="90" width="720" height="200" rx="12" fill="#eef6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="56" y="118" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#1e40af">Agent execution plane</text>
  <text x="56" y="138" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#334155">Spec-driven LangGraph StateGraph</text>

  <rect x="60" y="160" width="150" height="90" rx="8" fill="#fff" stroke="#93c5fd"/>
  <text x="75" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#0f172a">Knowledge</text>
  <text x="75" y="215" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">RDF artifacts</text>

  <text x="220" y="210" font-size="18" fill="#3b82f6">→</text>

  <rect x="250" y="160" width="150" height="90" rx="8" fill="#fff" stroke="#93c5fd"/>
  <text x="265" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#0f172a">Critic</text>
  <text x="265" y="215" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">Validate + grade</text>

  <text x="410" y="210" font-size="18" fill="#3b82f6">→</text>

  <rect x="440" y="160" width="150" height="90" rx="8" fill="#fff" stroke="#93c5fd"/>
  <text x="455" y="195" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#0f172a">Compliance</text>
  <text x="455" y="215" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#64748b">GO / NO-GO</text>

  <text x="600" y="210" font-size="18" fill="#3b82f6">→</text>
  <rect x="630" y="175" width="110" height="60" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="655" y="210" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#166534">Verdict</text>

  <rect x="40" y="320" width="1120" height="360" rx="12" fill="#f8f5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="56" y="348" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#5b21b6">Governance control plane</text>
  <text x="56" y="368" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#334155">Mediates policy, identity, privilege, reliability, compliance, tool trust, audit, observability</text>

  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="56" y="400" width="145" height="100" rx="8" fill="#fff" stroke="#22c55e" stroke-width="2"/>
    <text x="68" y="424" font-size="11" font-weight="700" fill="#15803d">1 OS / ACS</text>
    <text x="68" y="442" font-size="10" fill="#166534">INTEGRATED</text>
    <text x="68" y="462" font-size="9" fill="#64748b">LiteGovernor + ACS</text>
    <text x="68" y="478" font-size="9" fill="#64748b">host enforce</text>

    <rect x="211" y="400" width="145" height="100" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="223" y="424" font-size="11" font-weight="700" fill="#475569">2 Mesh</text>
    <text x="223" y="442" font-size="10" fill="#64748b">PROJECTED</text>
    <text x="223" y="462" font-size="9" fill="#64748b">did:acl + tiers</text>

    <rect x="366" y="400" width="145" height="100" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <text x="378" y="424" font-size="11" font-weight="700" fill="#b45309">3 Runtime</text>
    <text x="378" y="442" font-size="10" fill="#b45309">PARTIAL</text>
    <text x="378" y="462" font-size="9" fill="#64748b">rings + kill switch</text>

    <rect x="521" y="400" width="145" height="100" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="2"/>
    <text x="533" y="424" font-size="11" font-weight="700" fill="#b45309">4 SRE</text>
    <text x="533" y="442" font-size="10" fill="#b45309">PARTIAL</text>
    <text x="533" y="462" font-size="9" fill="#64748b">circuit breaker</text>

    <rect x="676" y="400" width="145" height="100" rx="8" fill="#fff" stroke="#a78bfa" stroke-width="2"/>
    <text x="688" y="424" font-size="11" font-weight="700" fill="#6d28d9">5 Compliance</text>
    <text x="688" y="442" font-size="10" fill="#6d28d9">ILLUSTRATIVE</text>
    <text x="688" y="462" font-size="9" fill="#64748b">OWASP evidence</text>

    <rect x="831" y="400" width="145" height="100" rx="8" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
    <text x="843" y="424" font-size="11" font-weight="700" fill="#475569">6 Marketplace</text>
    <text x="843" y="442" font-size="10" fill="#64748b">PROJECTED</text>
    <text x="843" y="462" font-size="9" fill="#64748b">fingerprints / Ed25519</text>

    <rect x="986" y="400" width="145" height="100" rx="8" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="998" y="424" font-size="11" font-weight="700" fill="#64748b">7 Lightning</text>
    <text x="998" y="442" font-size="10" fill="#94a3b8">REFERENCE</text>
    <text x="998" y="462" font-size="9" fill="#64748b">training-time only</text>
  </g>

  <rect x="56" y="530" width="1080" height="120" rx="8" fill="#fff" stroke="#e2e8f0"/>
  <text x="72" y="560" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#0f172a">Enforcement path (every tool call)</text>
  <text x="72" y="588" font-family="ui-monospace,monospace" font-size="13" fill="#1e293b">RuntimeGuard  →  LiteGovernor  →  optional ACS (EVALUATE_ONLY)  →  host PermissionError if denied</text>
  <text x="72" y="618" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">Audit JSONL · OpenTelemetry events · optional Langfuse traces · compliance_evidence.json · sre_state.json</text>
</svg>
