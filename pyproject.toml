[project]
name = "agent-control-lab"
version = "0.2.0"
description = "Agent Control Lab — spec-driven LangGraph agents under Microsoft Agent Governance Toolkit (7-layer showcase) + Langfuse"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agent Control Lab Contributors" }]
keywords = ["agent-governance", "agent-control-lab", "langgraph", "langfuse", "agt"]
dependencies = [
  "agent-os-kernel>=0.1.0",
  "agent-control-specification>=0.1.0",
  "langchain>=0.3.0",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langgraph>=0.2.0",
  "rdflib>=7.0.0",
  "pyyaml>=6.0",
  "streamlit>=1.30.0",
  "opentelemetry-api>=1.20.0",
  "opentelemetry-sdk>=1.20.0",
  "langfuse>=2.0.0",
]

[project.optional-dependencies]
xai = ["langchain-xai>=0.1.0"]
google = ["langchain-google-genai>=2.0.0", "google-auth>=2.0.0"]
all = ["agent-control-lab[xai,google]"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
agent-control-lab = "agt_demo.cli:main"
acl = "agt_demo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agt_demo"]
